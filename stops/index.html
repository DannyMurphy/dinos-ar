<!doctype HTML>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <!-- Fathom - beautiful, simple website analytics -->
  <script src="https://cdn.usefathom.com/script.js" data-site="TOFAEKGC" defer></script>
  <!-- / Fathom -->
  <link rel="stylesheet" href="/style-2.css">
</head>

<body style='margin : 0px;'>
  <div class="content2">
    <img src="../dinos/images/dino1.jpg" alt="Dinosaur Discovery" />
    <h1>Little Big Dinosaur Trail</h1>

    <div id="stops">


    </div>
  </div>

  <div class="fixed">
    <img src="../images/codescanner.png" alt="Code scanner" height="30px"
      style="margin-top: 1rem; text-align: right;" />
    <button class="button" onclick="location.href='../index.html';">
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-camera-icon lucide-camera">
        <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" />
        <circle cx="12" cy="13" r="3" />
      </svg></button>

    <button class="button-stops">Found Dinosaurs</button>
  </div>

  <dialog id="dino-details" class="dino-details" aria-labelledby="details-title">
    <div class="details-toolbar">
      <h2 id="details-title"></h2>
      <button type="button" id="close-details">Close</button>
    </div>
    <p id="flip-help">Tap the card to flip it.</p>
    <button type="button" id="details-card" class="details-card" aria-describedby="flip-help" aria-label="Show back of card">
      <span class="details-content">
        <span class="details-front"><img id="details-front" alt=""></span>
        <span class="details-back"><img id="details-back" alt=""></span>
      </span>
    </button>
  </dialog>
  <p id="audio-status" class="audio-status" role="status"></p>

  <script>
    async function getData() {
      const url = "/dinos/data-3.json";
      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`Response status: ${response.status}`);
        }

        const json = await response.json();
        stops(json.data);
      } catch (error) {
        console.error(error.message);
      }
    }
    getData();

    function stops(data) {
      const list = document.createElement('div');
      list.className = 'stops';
      for (const dino of data) {
        const found = Boolean(localStorage.getItem('dinomarker2' + dino.stop));
        const entry = document.createElement('div');
        entry.className = 'card2';
        entry.id = 'dino' + dino.stop;

        const image = document.createElement('img');
        image.src = found ? dino.stop_image : '../dinos/images/Artboard 3-100.jpg';
        image.alt = found ? dino.stop_name : 'Dinosaur Discovery';
        const info = document.createElement('div');
        const title = document.createElement('h2');
        title.textContent = found ? dino.stop_name : dino.stop_holding;
        const description = document.createElement('p');
        description.textContent = found ? dino.stop_holding : 'Not found yet';
        info.append(title, description);
        entry.append(image, info);

        if (found) {
          const check = document.createElement('span');
          check.className = 'found-check';
          check.textContent = '✓';
          check.setAttribute('aria-label', 'Found');
          entry.append(check);
          const actions = document.createElement('div');
          actions.className = 'stop-actions';
          const play = document.createElement('button');
          play.type = 'button';
          play.textContent = 'Play';
          play.setAttribute('aria-label', 'Play audio for ' + dino.stop_name);
          play.setAttribute('aria-pressed', 'false');
          play.addEventListener('click', () => playAudio(dino, play));
          const learn = document.createElement('button');
          learn.type = 'button';
          learn.textContent = 'Learn';
          learn.setAttribute('aria-label', 'Learn about ' + dino.stop_name);
          learn.setAttribute('aria-haspopup', 'dialog');
          learn.addEventListener('click', () => showCard(dino));
          actions.append(play, learn);
          entry.append(actions);
        }
        list.append(entry);
      }
      document.getElementById('stops').replaceChildren(list);
    }

    let currentAudio = null;
    let currentPlayButton = null;
    const audioStatus = document.getElementById('audio-status');

    function stopAudio() {
      if (currentAudio) currentAudio.pause();
      if (currentPlayButton) {
        currentPlayButton.textContent = 'Play';
        currentPlayButton.setAttribute('aria-pressed', 'false');
        currentPlayButton.setAttribute('aria-label', currentPlayButton.dataset.playLabel);
      }
      currentAudio = null;
      currentPlayButton = null;
    }

    async function playAudio(dino, button) {
      const wasPlaying = currentPlayButton === button;
      stopAudio();
      audioStatus.textContent = '';
      if (wasPlaying) return;

      const audio = new Audio(dino.stop_audio);
      currentAudio = audio;
      currentPlayButton = button;
      button.dataset.playLabel = 'Play audio for ' + dino.stop_name;
      button.textContent = 'Stop';
      button.setAttribute('aria-label', 'Stop audio for ' + dino.stop_name);
      button.setAttribute('aria-pressed', 'true');
      audio.addEventListener('ended', () => {
        if (currentAudio === audio) stopAudio();
      });
      const failed = () => {
        if (currentAudio !== audio) return;
        stopAudio();
        audioStatus.textContent = 'Audio could not be played. Please try again.';
      };
      audio.addEventListener('error', failed);
      try {
        await audio.play();
      } catch (error) {
        failed();
      }
    }

    const details = document.getElementById('dino-details');
    const card = document.getElementById('details-card');
    function showCard(dino) {
      document.getElementById('details-title').textContent = dino.stop_name;
      const front = document.getElementById('details-front');
      const back = document.getElementById('details-back');
      front.src = dino.stop_front;
      front.alt = dino.stop_name + ' card front';
      back.src = dino.stop_back;
      back.alt = dino.stop_name + ' card back';
      card.classList.remove('active');
      card.setAttribute('aria-label', 'Show back of card');
      details.showModal();
    }
    card.addEventListener('click', () => {
      const flipped = card.classList.toggle('active');
      card.setAttribute('aria-label', flipped ? 'Show front of card' : 'Show back of card');
    });
    document.getElementById('close-details').addEventListener('click', () => details.close());
    details.addEventListener('click', event => {
      if (event.target === details) details.close();
    });
    window.addEventListener('pagehide', stopAudio);
  </script>
</body>

</html>
